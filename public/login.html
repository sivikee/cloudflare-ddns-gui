<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in · Cloudflare DDNS</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: #f6f7f9;
    color: #1c1f23;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #fff;
    border: 1px solid #e3e5e8;
    border-radius: 8px;
    padding: 28px 24px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #d4d7dc;
    border-radius: 6px;
    background: #fff;
    color: #1c1f23;
  }
  input:focus { outline: 2px solid #f6821f33; border-color: #f6821f; }
  button {
    width: 100%;
    margin-top: 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: #f6821f;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #f8c391; cursor: default; }
  .error-box {
    background: #fdeaea;
    color: #a12626;
    border: 1px solid #f3c2c2;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
</style>
</head>
<body>
<form class="card" id="loginForm">
  <h1>Cloudflare DDNS</h1>
  <p class="sub">Log in to manage your DNS records.</p>

  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username" required autofocus />

  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required />

  <button type="submit" id="loginBtn">Log in</button>
  <div class="error-box" id="errorBox"></div>
</form>

<script>
  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const errorBox = document.getElementById("errorBox");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `login failed (HTTP ${res.status})`);
      location.replace("/");
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      form.password.value = "";
      form.password.focus();
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
