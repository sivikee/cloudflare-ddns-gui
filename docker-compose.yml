services:
  ddns-gui:
    image: sivikee/cloudflare-ddns-gui:latest
    # To build from source instead of pulling from Docker Hub, replace the
    # line above with:  build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTH_USER=${AUTH_USER}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - UPDATE_INTERVAL_MINUTES=${UPDATE_INTERVAL_MINUTES:-5}
    volumes:
      - ./data:/data
